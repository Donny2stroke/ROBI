[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robi-core"
version = "0.3.3"
description = "ROBI: desktop robot core and vision laboratory"
requires-python = ">=3.11,<3.15"
dependencies = ["opencv-python>=4.8,<5", "mediapipe>=0.10.14,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.7,<1"]
emotion = ["deepface>=0.0.90,<1"]

[project.scripts]
robi = "robi.cli:main"

[tool.setuptools]
packages = ["robi"]
include-package-data = true

[tool.setuptools.package-data]
robi = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
